<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#f97316"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
  </defs>
  <rect width="900" height="360" rx="28" fill="url(#dusk)"/>
  <circle cx="450" cy="1100" r="820" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
  <circle cx="450" cy="1100" r="780" fill="#1f2937"/>
  <text x="450" y="345" fill="#e5e7eb" font-size="16" text-anchor="middle">Earth</text>
  <text x="760" y="262" fill="#fef3c7" font-size="14" text-anchor="middle">edge of the atmosphere</text>
  <circle cx="80" cy="250" r="34" fill="#fb923c"/>
  <line x1="115" y1="250" x2="440" y2="318" stroke="#fdba74" stroke-width="6" stroke-linecap="round"/>
  <line x1="115" y1="250" x2="440" y2="318" stroke="#fff" stroke-width="2" stroke-dasharray="4 10"/>
  <circle cx="450" cy="320" r="6" fill="#fef08a"/>
  <text x="40" y="190" fill="#fff" font-size="17" font-weight="700">Sunset: a long path through air</text>
  <text x="40" y="212" fill="#fff7ed" font-size="15">most blue is scattered away before it reaches you</text>
  <circle cx="450" cy="40" r="28" fill="#fde68a"/>
  <line x1="450" y1="70" x2="450" y2="312" stroke="#fef9c3" stroke-width="6" stroke-linecap="round"/>
  <text x="475" y="120" fill="#fff" font-size="17" font-weight="700">Noon: a short path</text>
  <text x="475" y="144" fill="#fff7ed" font-size="15">sunlight stays nearly white</text>
</svg>
