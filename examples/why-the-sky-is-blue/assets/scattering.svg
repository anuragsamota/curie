<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff7cc"/><stop offset="1" stop-color="#fbbf24"/></radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
  </defs>
  <rect width="900" height="420" rx="28" fill="url(#sky)"/>
  <path d="M0 330 Q450 300 900 330 V420 H0z" fill="#14532d"/>
  <circle cx="110" cy="100" r="52" fill="url(#sun)"/>
  <text x="110" y="185" fill="#fff" font-size="18" text-anchor="middle" font-weight="700">Sun</text>
  <!-- white light beam -->
  <line x1="165" y1="120" x2="455" y2="200" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <text x="300" y="138" fill="#fff" font-size="16" transform="rotate(15 300 138)">white sunlight</text>
  <!-- molecule -->
  <circle cx="470" cy="205" r="20" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="4"/>
  <text x="470" y="250" fill="#fff" font-size="15" text-anchor="middle">N₂ / O₂ molecule</text>
  <!-- scattered blue -->
  <g stroke="#60a5fa" stroke-width="5" marker-end="url(#a)" stroke-linecap="round">
    <line x1="490" y1="190" x2="600" y2="90"/><line x1="490" y1="205" x2="640" y2="180"/>
    <line x1="480" y1="225" x2="590" y2="320"/><line x1="455" y1="190" x2="400" y2="70"/>
  </g>
  <!-- red passes through -->
  <line x1="492" y1="212" x2="830" y2="300" stroke="#f87171" stroke-width="5" marker-end="url(#a)" stroke-linecap="round"/>
  <text x="640" y="232" fill="#fecaca" font-size="16" transform="rotate(15 640 232)">red mostly passes straight</text>
  <text x="615" y="80" fill="#dbeafe" font-size="16">blue scatters everywhere</text>
  <!-- observer -->
  <g transform="translate(560 330)"><circle cy="-34" r="11" fill="#fde68a"/><path d="M0 -22 V10 M-14 -8 H14 M0 10 L-10 30 M0 10 L10 30" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/></g>
  <line x1="560" y1="285" x2="620" y2="190" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="590" y="372" fill="#fff" font-size="15">you see blue light</text>
  <text x="590" y="392" fill="#fff" font-size="15">from every direction</text>
</svg>
