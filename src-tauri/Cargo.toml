[package]
name = "curie"
version = "0.3.0"
description = "Curie portable learning app"
authors = ["Curie contributors"]
edition = "2021"

# Mobile builds load the app as a shared library; desktop links it into the binary.
[lib]
name = "curie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# unsafe-headers lets requests drop the Origin header; Ollama rejects unknown origins with 403.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
